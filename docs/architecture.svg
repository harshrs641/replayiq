<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Inter', 'SF Pro', system-ui, sans-serif">
  <title>ReplayIQ Architecture — 4-service Kafka topology</title>
  <desc>Browser SDK → Gateway → Ingest → Kafka (Redpanda) → Processor → MinIO + Ollama. Query service reads Postgres and MinIO for the React dashboard.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="white"/>

  <!-- BROWSER -->
  <rect x="20" y="30" width="150" height="90" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="95" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Browser</text>
  <text x="95" y="72" text-anchor="middle" font-size="9.5" fill="#475569">replayiq.js SDK</text>
  <text x="95" y="88" text-anchor="middle" font-size="9" fill="#64748b">rrweb · PII masking</text>
  <text x="95" y="104" text-anchor="middle" font-size="9" fill="#64748b">batched flush 5s</text>

  <!-- GATEWAY -->
  <rect x="230" y="30" width="140" height="90" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="300" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Gateway</text>
  <text x="300" y="72" text-anchor="middle" font-size="9.5" fill="#78350f">:8080 — public</text>
  <text x="300" y="88" text-anchor="middle" font-size="9" fill="#92400e">writes → Ingest</text>
  <text x="300" y="104" text-anchor="middle" font-size="9" fill="#92400e">reads  → Query</text>

  <!-- Browser → Gateway -->
  <line x1="170" y1="75" x2="228" y2="75" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="199" y="67" text-anchor="middle" font-size="8" fill="#6b7280">events</text>

  <!-- INGEST -->
  <rect x="230" y="180" width="140" height="90" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="300" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Ingest</text>
  <text x="300" y="220" text-anchor="middle" font-size="9.5" fill="#166534">:8081</text>
  <text x="300" y="236" text-anchor="middle" font-size="9" fill="#166534">write session → PG</text>
  <text x="300" y="252" text-anchor="middle" font-size="9" fill="#166534">publish → Kafka</text>

  <!-- Gateway → Ingest (write) -->
  <line x1="300" y1="120" x2="300" y2="178" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="310" y="152" font-size="8" fill="#3b82f6">POST /events</text>

  <!-- KAFKA / REDPANDA -->
  <rect x="450" y="155" width="190" height="135" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="545" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">Kafka · Redpanda</text>
  <text x="545" y="194" text-anchor="middle" font-size="9" fill="#7c3aed">12 partitions · keyed by session_id</text>

  <rect x="462" y="202" width="166" height="19" rx="4" fill="#ede9fe"/>
  <text x="545" y="215" text-anchor="middle" font-size="9" fill="#5b21b6">events.raw</text>

  <rect x="462" y="226" width="166" height="19" rx="4" fill="#ede9fe"/>
  <text x="545" y="239" text-anchor="middle" font-size="9" fill="#5b21b6">events.masked</text>

  <rect x="462" y="250" width="166" height="19" rx="4" fill="#ede9fe"/>
  <text x="545" y="263" text-anchor="middle" font-size="9" fill="#5b21b6">session.analyze-requested</text>

  <!-- Ingest → Kafka -->
  <line x1="370" y1="225" x2="448" y2="225" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="409" y="217" text-anchor="middle" font-size="8" fill="#8b5cf6">publish</text>

  <!-- PROCESSOR -->
  <rect x="450" y="345" width="190" height="110" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="545" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Processor</text>
  <text x="545" y="384" text-anchor="middle" font-size="9" fill="#9a3412">3 consumer goroutines</text>

  <rect x="462" y="392" width="78" height="17" rx="4" fill="#ffedd5"/>
  <text x="501" y="404" text-anchor="middle" font-size="8.5" fill="#7c2d12">storage-raw</text>

  <rect x="462" y="414" width="78" height="17" rx="4" fill="#ffedd5"/>
  <text x="501" y="426" text-anchor="middle" font-size="8.5" fill="#7c2d12">storage-masked</text>

  <rect x="462" y="436" width="78" height="17" rx="4" fill="#ffedd5"/>
  <text x="501" y="448" text-anchor="middle" font-size="8.5" fill="#7c2d12">ai-worker</text>

  <!-- Kafka → Processor -->
  <line x1="545" y1="290" x2="545" y2="343" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="555" y="320" font-size="8" fill="#8b5cf6">consume</text>

  <!-- MINIO -->
  <rect x="700" y="345" width="160" height="75" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="780" y="369" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">MinIO · S3-compat</text>
  <text x="780" y="385" text-anchor="middle" font-size="9" fill="#0e7490">sessions/{id}/{ts}.json</text>
  <text x="780" y="400" text-anchor="middle" font-size="9" fill="#0e7490">raw + masked buckets</text>
  <text x="780" y="415" text-anchor="middle" font-size="9" fill="#64748b">swap: AWS S3 · R2 · GCS</text>

  <!-- Processor → MinIO -->
  <line x1="640" y1="400" x2="698" y2="390" stroke="#0e7490" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- OLLAMA -->
  <rect x="700" y="440" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="780" y="463" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Ollama · Local LLM</text>
  <text x="780" y="479" text-anchor="middle" font-size="9" fill="#166534">llama3.1:8b (default)</text>
  <text x="780" y="494" text-anchor="middle" font-size="9" fill="#166534">nomic-embed-text</text>
  <text x="780" y="509" text-anchor="middle" font-size="9" fill="#64748b">swap: any Ollama model</text>

  <!-- Processor → Ollama -->
  <line x1="640" y1="440" x2="698" y2="465" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- POSTGRES -->
  <rect x="20" y="345" width="160" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Postgres + pgvector</text>
  <text x="100" y="385" text-anchor="middle" font-size="9" fill="#475569">sessions · ai_issues</text>
  <text x="100" y="400" text-anchor="middle" font-size="9" fill="#475569">write pool (ingest)</text>
  <text x="100" y="415" text-anchor="middle" font-size="9" fill="#475569">read pool (query)</text>
  <text x="100" y="430" text-anchor="middle" font-size="9" fill="#64748b">swap: RDS · Neon · Supabase</text>

  <!-- Ingest → Postgres -->
  <line x1="230" y1="240" x2="182" y2="360" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="192" y="306" text-anchor="middle" font-size="8" fill="#6b7280">write</text>

  <!-- QUERY -->
  <rect x="230" y="345" width="150" height="90" rx="10" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="305" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">Query</text>
  <text x="305" y="384" text-anchor="middle" font-size="9.5" fill="#6b21a8">:8082</text>
  <text x="305" y="400" text-anchor="middle" font-size="9" fill="#6b21a8">sessions · replay</text>
  <text x="305" y="416" text-anchor="middle" font-size="9" fill="#6b21a8">search · issues</text>
  <text x="305" y="432" text-anchor="middle" font-size="9" fill="#6b21a8">read-only</text>

  <!-- Gateway → Query (read) -->
  <line x1="300" y1="120" x2="305" y2="343" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="260" y="230" font-size="8" fill="#3b82f6">GET /sessions</text>

  <!-- Postgres → Query -->
  <line x1="180" y1="400" x2="228" y2="400" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DASHBOARD -->
  <rect x="20" y="500" width="380" height="90" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="210" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">React Dashboard :3000</text>
  <text x="210" y="540" text-anchor="middle" font-size="9" fill="#7f1d1d">session list + replay · AI summary · issues board · Jira push</text>
  <text x="210" y="556" text-anchor="middle" font-size="9" fill="#7f1d1d">rage-click highlights · frustration timeline · semantic search</text>
  <text x="210" y="572" text-anchor="middle" font-size="9" fill="#64748b">served via Vite dev / Nginx in prod</text>

  <!-- Dashboard → Gateway -->
  <line x1="210" y1="500" x2="300" y2="122" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- MinIO → Query (for replay) -->
  <line x1="700" y1="370" x2="382" y2="380" stroke="#0e7490" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="550" y="365" text-anchor="middle" font-size="8" fill="#0e7490">replay events</text>

  <!-- BYO Legend -->
  <rect x="450" y="515" width="420" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="660" y="535" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Bring Your Own Infrastructure</text>
  <circle cx="466" cy="551" r="4" fill="#10b981"/>
  <text x="474" y="555" font-size="9" fill="#374151">LLM: any Ollama model (llama3, mistral, phi, gemma…)</text>
  <circle cx="466" cy="568" r="4" fill="#10b981"/>
  <text x="474" y="572" font-size="9" fill="#374151">Storage: any S3-compat (AWS S3, Cloudflare R2, GCS)</text>
  <circle cx="466" cy="585" r="4" fill="#10b981"/>
  <text x="474" y="589" font-size="9" fill="#374151">Kafka: Redpanda, Confluent, AWS MSK — same API</text>
  <circle cx="466" cy="602" r="4" fill="#10b981"/>
  <text x="474" y="606" font-size="9" fill="#374151">DB: any managed Postgres (RDS, Neon, Supabase, Aiven)</text>
</svg>
