name: replayiq_flutter
description: ReplayIQ session replay for Flutter. Records screenshots (masked on the device), touches, navigation, taps, console, errors and network calls.
version: 1.0.0
homepage: https://replayiq.dev
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.0
  vector_math: ^2.1.4
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.replayiq.replayiq_flutter
        pluginClass: ReplayIQFlutterPlugin
      ios:
        pluginClass: ReplayIQFlutterPlugin
